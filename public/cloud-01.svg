<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 900">
  <defs>
    <filter id="blurA" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="noiseA" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="4" seed="9"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.74
        0 1 0 0 0.76
        0 0 1 0 0.72
        0 0 0 0.55 0"/>
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="fadeA" x1="0" x2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.12" stop-color="white" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="white" stop-opacity="1"/>
      <stop offset="0.88" stop-color="white" stop-opacity="0.65"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskA">
      <rect width="2200" height="900" fill="url(#fadeA)"/>
    </mask>
  </defs>
  <g mask="url(#maskA)" filter="url(#blurA)" fill="#eef0eb" opacity="0.62">
    <ellipse cx="260" cy="480" rx="360" ry="160"/>
    <ellipse cx="620" cy="410" rx="420" ry="190"/>
    <ellipse cx="980" cy="470" rx="360" ry="170"/>
    <ellipse cx="1420" cy="390" rx="500" ry="210"/>
    <ellipse cx="1890" cy="470" rx="410" ry="180"/>
  </g>
  <rect width="2200" height="900" filter="url(#noiseA)" opacity="0.30" mask="url(#maskA)"/>
</svg>