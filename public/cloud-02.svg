<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 900">
  <defs>
    <filter id="blurB" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="noiseB" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.006" numOctaves="5" seed="17"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.78
        0 1 0 0 0.80
        0 0 1 0 0.76
        0 0 0 0.48 0"/>
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="fadeB" x1="0" x2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.10" stop-color="white" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="white" stop-opacity="1"/>
      <stop offset="0.90" stop-color="white" stop-opacity="0.7"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskB">
      <rect width="2200" height="900" fill="url(#fadeB)"/>
    </mask>
  </defs>
  <g mask="url(#maskB)" filter="url(#blurB)" fill="#f4f4ef" opacity="0.48">
    <ellipse cx="180" cy="420" rx="300" ry="150"/>
    <ellipse cx="520" cy="510" rx="430" ry="185"/>
    <ellipse cx="970" cy="390" rx="460" ry="220"/>
    <ellipse cx="1500" cy="520" rx="520" ry="210"/>
    <ellipse cx="2050" cy="400" rx="330" ry="155"/>
  </g>
  <rect width="2200" height="900" filter="url(#noiseB)" opacity="0.24" mask="url(#maskB)"/>
</svg>